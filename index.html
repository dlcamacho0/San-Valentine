<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nayari 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.18);
      padding: 25px;
      border-radius: 25px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    img {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 12px 22px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: white;
      color: #ff4d6d;
      position: relative;
    }

    #final {
      display: none;
      font-size: 2.5em;
      margin-top: 20px;
      animation: pop 1s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
  </style>
</head>

<body>

  <audio id="music" loop>
    <source src="..//San-Valentine/Jay Wheeler - EaZt (Official Video) - Jay Wheeler.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <img src="..//San-Valentine/nosotros.jpeg" alt="Nosotros">

    <h1>Nayari 💖</h1>
    <p>
      No sé cómo explicarlo mejor,<br>
      pero me encantaría compartir este San Valentín contigo.
    </p>

    <h2>¿Quieres ser mi San Valentín? 🌹</h2>

    <div class="buttons">
      <button id="yes">Sí 💘</button>
      <button id="no">No 🙈</button>
    </div>

    <div id="final">TE AMO ❤️</div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const finalMsg = document.getElementById("final");
    const music = document.getElementById("music");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    yesBtn.addEventListener("click", () => {
      finalMsg.style.display = "block";
      music.play();
    });
  </script>

</body>
</html>
